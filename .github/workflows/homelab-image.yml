name: homelab image

# Builds the patched neolink image so the homelab does not depend on a
# binary built by hand on a laptop. Consumed by homelab-apps apps/frigate.

on:
  push:
    branches: [homelab-frigate]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: homelab-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/neolink:homelab-frigate
            ghcr.io/${{ github.repository_owner }}/neolink:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Also publish the raw binary. bootstrap.sh bakes it into the upstream
      # image, and a release asset needs no registry credentials on the LXC.
      - name: Extract binary from the built image
        run: |
          docker create --name neolink-extract "ghcr.io/${{ github.repository_owner }}/neolink:${{ github.sha }}"
          docker cp neolink-extract:/usr/local/bin/neolink ./neolink_linux_amd64
          docker rm neolink-extract
          chmod +x neolink_linux_amd64
          sha256sum neolink_linux_amd64 | tee neolink_linux_amd64.sha256

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete homelab-frigate --yes --cleanup-tag 2>/dev/null || true
          gh release create homelab-frigate \
            --title "neolink homelab-frigate build" \
            --notes "Patched neolink for Frigate multi-client RTSP. Built from ${{ github.sha }}." \
            --target "${{ github.sha }}" \
            neolink_linux_amd64 neolink_linux_amd64.sha256
